# Android libraries an app's own native code links against, answered by ATL.
#
# bionic_translation reads this from $XDG_DATA_DIRS/bionic_translation/cfg.d.
# The left column is the soname in the app library's DT_NEEDED (or its dlopen
# argument), the right one is the host library that answers for it.
#
# The three NDK ones forward into the device's real Android library through
# libhybris (src/hybris-ndk/); the vendor ones are empty libraries that log
# their own name, so an app's optional-feature dlopen fails on the symbol it
# wanted rather than on a NULL handle it did not check. See hybris_ndk.h and
# vendor_stub.c.

libcamera2ndk.so    libatl_camera2ndk.so.0
libbinder_ndk.so    libatl_binder_ndk.so.0
libnativewindow.so  libatl_nativewindow.so.0

# android_load_sphal_library() really does reach the vendor library, through
# libhybris' loader
libvndksupport.so   libatl_vndksupport.so.0

# The two vendor libraries Google Camera's camera graph is built on. Neither is
# stubbable: lib_aion_buffer.so is the dma-buf allocator every buffer comes from
# and its context CHECKs that it answered (SIGABRT), and libOpenCL.so is
# late-bound with no null check, so the first call branches to 0 (SIGSEGV).
lib_aion_buffer.so  libatl_aion.so.0
libOpenCL.so        libatl_opencl.so.0

# the Pixel's TPU/GXP stack and the rest: HDR+ and the ML modules, out of scope
libgxp.so                     libatl_stub_libgxp.so.0
libedgetpu_client.google.so   libatl_stub_libedgetpu_client.so.0
libedgetpu_tachyon.google.so  libatl_stub_libedgetpu_tachyon.so.0
libedgetpu_util.so            libatl_stub_libedgetpu_util.so.0
libOpenCL-pixel.so            libatl_stub_libOpenCL_pixel.so.0
lib_jpg_encoder.so            libatl_stub_lib_jpg_encoder.so.0

# Plain libraries whose bionic soname has no host file of that exact name.
# Without these the linker reports "library 'libz.so' not found" and the app's
# imports quietly fall back to whatever is already in the process.
libm.so             libm.so.6
libz.so             libz.so.1
# ATL's libandroid implements AndroidBitmap_getInfo/lockPixels/unlockPixels
libjnigraphics.so   libandroid.so.0

# Not listed on purpose, because a correct host library of that name is already
# reachable:
#  * libcutils.so and liblog.so ship next to ART (usr/lib/art);
#  * libsync.so is libhybris' own - it really does export sync_wait/sync_merge.
